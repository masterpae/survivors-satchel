# The catalog's addons: the game Discord's verified-addons channel, each pinned to its author's
# GitHub repository, so a look-alike copy can't take its place. `tools/catalog` reads this list and
# GitHub and writes catalog.json beside it (build.sh catalog); everything about releases comes from
# GitHub, only the fields below are ours.
#
#   id, name, group     how the Satchel shows it; groups as in Browse
#   repo                owner/name on GitHub, the only place its files come from
#   summary             what it does, in one line, from the author's own description
#   folders             its folders in AddOns, the main one first
#   asset               the release file that is the addon (* = any text)
#   by_tag = true       instead of asset: the author publishes by tag, with no file attached
#   doesnt_mix_with     folders its author asks you to turn off
#   notes               shown before installing
#
# Each addon here has its post in the verified channel, and its repo is that post's author's own
# (read 29 and 31 Oct and 4 Nov 2026). An addon whose post leaves the channel leaves this list, and
# comes back with its post (BordoUI: out on 31 Oct 2026, back on 4 Nov 2026 under Older Posts).
#
# discord_checked, above the addons: the day this list was last compared with the channel, by
# hand. The Satchel shows it ("checked on"); change it at each comparison.

discord_checked = "2026-11-04"

# Full interfaces

[[addon]]
id = "aether-hud"
name = "AetherHUD"
repo = "NORehabRocket/AetherHUD"
group = "Full interfaces"
summary = "A full interface: run HUD, enemy plates, combat numbers, bags, chat, minimap"
folders = ["AetherHUD"]
asset = "AetherHUD.zip"

[[addon]]
id = "blackwell-ui"
name = "BlackwellUI"
repo = "Blackwellcode/BlackwellUI"
group = "Full interfaces"
summary = "A full HUD and analytics overhaul"
folders = ["BlackwellUI"]
asset = "BlackwellUI.zip"

[[addon]]
id = "keijin-ui"
name = "KeijinUI"
repo = "KeijinDE/KeijinUI_modern-as-ui"
group = "Full interfaces"
summary = "A modern interface inspired by Dragonflight"
folders = ["KeijinUI"]
asset = "KeijinUI-*.zip"
doesnt_mix_with = ["SurvivorsDragonUi", "SurvivorUI", "KeijinBuildBar", "KeijinRunCounters", "KeijinAchievements"]

[[addon]]
id = "survivor-ui"
name = "Survivor UI"
repo = "morderous/survivor-ui"
group = "Full interfaces"
summary = "A simple interface, with Survivor Plates"
folders = ["SurvivorUI", "SurvivorPlates"]
# The same release carries SurvivorUI-Installer.zip, a program: never that one.
asset = "SurvivorUI-v*.zip"

[[addon]]
id = "survivor-ui-classic"
name = "SurvivorUI Classic"
repo = "morderous/survivorui-classic"
group = "Full interfaces"
summary = "Survivor UI in the game's own look: everything movable, a run tracker, boss bars, a damage meter"
folders = ["SurvivorUIClassic"]
# Its author: it can sit beside Survivor UI, only one runs, and a button in its options switches.
# The same release carries SurvivorUI-Installer.zip, a program, and SHA256SUMS.txt: never those.
asset = "SurvivorUIClassic-*.zip"

[[addon]]
id = "survivors-dragon-ui"
name = "SurvivorsDragonUi"
repo = "migwynkriid13/SurvivorsDragonUi"
group = "Full interfaces"
summary = "A fixed HUD: run and boss bars, combat text"
folders = ["SurvivorsDragonUi"]
# Each release also carries avrt.dll (its own updater) and updater files: never those.
asset = "SurvivorsDragonUi.zip"

