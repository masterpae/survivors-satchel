[package]
name = "satchel-catalog"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Builds catalog/catalog.json, the verified addons and their releases, from catalog/sources.toml and GitHub."
license = "MIT"
publish = false

[dependencies]
satchel-core = { path = "../../crates/satchel-core" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
# Runs on Linux only (the build host, later a robot on GitHub): rustls with its own root
# certificates. Pinned to a release with weeks in use (3.4.3 and 3.5.0 were 8 days old on
# 29 Oct 2026).
ureq = "=3.4.2"
