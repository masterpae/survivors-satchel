# Every push to main and every pull request: the core tests, and the Windows exe built. A push to
# main keeps its exe for a week as the run's artifact.
name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tests
        run: SATCHEL_LOCKED=1 sh build/build.sh test

      - name: The exe
        env:
          SATCHEL_LOCKED: "1"
          SATCHEL_GIT_COMMIT: ${{ github.sha }}
        run: sh build/build.sh exe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push'
        with:
          name: SurvivorsSatchel-${{ github.sha }}
          path: dist/SurvivorsSatchel.exe
          retention-days: 7

  # Cargo.lock against RustSec's advisories. cargo-audit is the prebuilt binary from its GitHub
  # release, checked against the SHA-256 GitHub lists for that file before it runs. Dependabot
  # doesn't see it: a newer cargo-audit is a new version and checksum here. Advisories that don't
  # reach the Satchel are listed, each with its reason, in .cargo/audit.toml.
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: cargo-audit, from its GitHub release
        env:
          AUDIT_VERSION: "0.22.2"
          AUDIT_SHA256: 7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428
        run: |
          name="cargo-audit-x86_64-unknown-linux-musl-v$AUDIT_VERSION"
          curl --max-time 120 -sSfL -o "$RUNNER_TEMP/$name.tgz" \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit/v$AUDIT_VERSION/$name.tgz"
          echo "$AUDIT_SHA256  $RUNNER_TEMP/$name.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"

      - name: Cargo.lock against the advisories
        run: cargo-audit audit --file Cargo.lock
