# A version tag (v0.5.0) builds the Windows exe and publishes it as that version's release. The
# release's notes are the version's section of CHANGELOG.md, the same text the app shows under
# Settings → About → What's new. A tag with a suffix (v0.6.0-rc.1) makes a pre-release.
#
# Two jobs: `build` compiles and tests with read access only; `publish` runs no repository code
# and only creates the release from what `build` left.
#
# Never delete a published release: once a PC has run it, every older Satchel stops syncing until
# it updates, and the newest release is what it looks for. Publish a higher version instead.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: The tag and Cargo.toml name the same version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but Cargo.toml says $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: The release notes, from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            index($0, "## " v " (") == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no dated section for $VERSION (a heading like: ## $VERSION (2026-11-02))"
            exit 1
          fi

      - name: Tests
        run: SATCHEL_LOCKED=1 sh build/build.sh test

      # The repository's name goes into the exe: a release build looks for newer releases here.
      - name: The exe
        env:
          SATCHEL_LOCKED: "1"
          SATCHEL_GIT_COMMIT: ${{ github.sha }}
          SATCHEL_REPOSITORY: ${{ github.repository }}
        run: |
          sh build/build.sh exe
          echo "$VERSION" > dist/version

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: |
            dist/SurvivorsSatchel.exe
            dist/version
            notes.md
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat dist/version)
          set -- --repo "$GITHUB_REPOSITORY" --title "Survivor's Satchel $version" --notes-file notes.md
          case "$version" in *-*) set -- "$@" --prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/SurvivorsSatchel.exe "$@"
