# Once a week: newer versions of the crates in Cargo.lock, of the actions the workflows use and of
# the build image (build/Dockerfile), as pull requests. A version is offered only once it is two
# weeks old.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14

  - package-ecosystem: docker
    directory: "/build"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
