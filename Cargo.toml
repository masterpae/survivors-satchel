[workspace]
members = ["crates/satchel-core", "tools/catalog", "tools/ui-preview"]

[package]
name = "survivors-satchel"
version = "0.9.1"
edition = "2024"
rust-version = "1.99"
description = "A Windows launcher for Azeroth Survivors: the same progress on every PC, playtime, addons."
license = "MIT"
publish = false

[[bin]]
name = "SurvivorsSatchel"
path = "src/main.rs"

[dependencies]
satchel-core = { path = "crates/satchel-core" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# Software renderer only: a small window needs no GPU context, and it keeps RAM low. It draws
# paths (the install spinner) only with `software-renderer-path`; without it they're skipped.
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "software-renderer-path",
    "accessibility",
    "system-tray",
    "raw-window-handle-06",
] }
# SurvivorsForge's icons and its addons' screenshots, decoded on the network thread into RGBA
# pixels for `slint::Image::from_rgba8`: PNG, JPEG and WebP only, never on the UI thread. The 0.25
# line Slint already brings (Cargo.lock), without its default formats.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
tauri-winrt-notification = "0.8.1"
# Addon downloads and GitHub's pages, through Windows' own TLS (SChannel) and certificate store.
# ureq puts native-tls in its connector only with its `native-tls` feature (`native-tls-no-default`
# alone leaves it out, and every https call panics); that feature also builds in a root list,
# which the agent never uses (RootCerts::PlatformVerifier). Pinned to a release with weeks in use
# (29 Oct 2026); its own dependencies are held by Cargo.lock.
ureq = { version = "=3.5.0", default-features = false, features = ["native-tls"] }
serde = "1.0.229"
serde_json = "1.0.154"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_WNet",
    "Win32_Security",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Shutdown",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
