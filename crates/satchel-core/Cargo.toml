[package]
name = "satchel-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Survivor's Satchel's sync engine: no UI, no Windows API, tested on any OS."
license = "MIT"
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.1.8"
# Addon zips are read with this, decompression only, pure Rust; pinned to a release that has had
# months in use (9.x was weeks old and still patched daily on 29 Oct 2026).
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3.27.0"
